<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="css/style.css">
  <title>Job Application</title>
</head>
<body>

  <h1>Al-Adel Group</h1>
  <h2>About Us</h2>
  <p>Al-Adel Group is a technology company specialized in web development and AI. We are looking for passionate individuals to move forward together into the future.</p>

  <h2>Apply Now</h2>
  <p>Fill in your details and we'll get back to you soon.</p>

  <div>
    <h3>Application Form</h3>
    <form>
      <label for="name">Full Name</label>
      <input type="text" id="name" placeholder="Enter your name">

      <label for="email">Email</label>
      <input type="email" id="email" placeholder="Enter your email">

      <label for="number">Number</label>
      <input type="number" id="number" placeholder="Enter your number">

      <button type="submit">Apply Now</button>
    </form>
  </div>

</body>
</html>
